name: judgment-tracing
version: 0.3.0
description: Send Hermes Agent turns to Judgment. Read-only observer hooks; a project opts in with .judgment/tracing.json.
author: Judgment Labs
kind: standalone
requires_env: []
provides_hooks:
  - on_session_start
  - on_session_end
  - on_session_finalize
  - on_session_reset
  - pre_llm_call
  - post_llm_call
  - pre_api_request
  - post_api_request
  - api_request_error
  - pre_tool_call
  - post_tool_call
  - subagent_start
  - subagent_stop
